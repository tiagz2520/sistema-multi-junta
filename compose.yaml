name: sistema-multi-junta

services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configura POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Configura POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  postgres-roles:
    image: postgres:18-bookworm
    command: ['sh', '/bootstrap/provision.sh']
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: ${POSTGRES_DB:?Configura POSTGRES_DB en .env}
      PGUSER: ${POSTGRES_USER:?Configura POSTGRES_USER en .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Configura POSTGRES_PASSWORD en .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Configura POSTGRES_APP_PASSWORD en .env}
      POSTGRES_MIGRATION_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?Configura POSTGRES_MIGRATION_PASSWORD en .env}
    volumes:
      - ./ops/postgres:/bootstrap:ro
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: '3000'
      PGHOST: postgres
      PGPORT: '5432'
      PGDATABASE: ${POSTGRES_DB:?Configura POSTGRES_DB en .env}
      PGUSER: multi_junta_app
      PGPASSWORD: ${POSTGRES_APP_PASSWORD:?Configura POSTGRES_APP_PASSWORD en .env}
      AUTH_ORIGIN: ${AUTH_ORIGIN:-http://127.0.0.1:5173}
      AUTH_IDLE_SECONDS: ${AUTH_IDLE_SECONDS:-1800}
      AUTH_ABSOLUTE_SECONDS: ${AUTH_ABSOLUTE_SECONDS:-43200}
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      postgres-roles:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/v1/health').then((response) => { if (!response.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      WEB_HOST: 0.0.0.0
      WEB_PORT: '5173'
      API_PROXY_TARGET: http://api:3000
    ports:
      - '127.0.0.1:${WEB_PORT:-5173}:5173'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/api/v1/health').then((response) => { if (!response.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
